<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Raid Controller</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #f5f5f5;
        }
        .live-counter {
            text-align: center;
            font-size: 13px;
            color: #888888;
            margin-bottom: 25px;
        }
        .live-counter span {
            color: #4cd137;
            font-weight: bold;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #333333;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        .slider-container {
            margin-bottom: 25px;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 5px;
        }
        input[type="range"] {
            padding: 0;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #4cd137;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kahoot Raid Panel</h2>
    <div class="live-counter">Connected Bots: <span id="botCounter">0</span></div>
    
    <form id="raidForm">
        <label for="pin">Kahoot Game PIN</label>
        <input type="text" id="pin" name="pin" required placeholder="e.g. 1013450">

        <label for="baseName">Bot Base Name</label>
        <input type="text" id="baseName" name="baseName" required placeholder="e.g. hack">

        <label for="count">Bot Count</label>
        <input type="number" id="count" name="count" required min="1" max="100" placeholder="e.g. 30">

        <div class="slider-container">
            <div class="slider-labels">
                <label>Einstein Accuracy</label>
                <span id="accuracyVal">50%</span>
            </div>
            <input type="range" id="accuracy" name="accuracy" min="0" max="100" value="50">
        </div>

        <button type="submit">Deploy Bots Instantly</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const slider = document.getElementById('accuracy');
    const output = document.getElementById('accuracyVal');
    slider.oninput = function() {
        output.innerHTML = this.value + "%";
    }

    // Polling function to fetch live tracking stats from back-end server
    async function updateLiveCounter() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('botCounter').innerText = data.activeCount;
        } catch (e) {}
    }
    // Check every 2 seconds
    setInterval(updateLiveCounter, 2000);

    document.getElementById('raidForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#b3b3b3';
        statusDiv.innerText = 'Sending network packets...';

        const data = {
            pin: document.getElementById('pin').value,
            baseName: document.getElementById('baseName').value,
            count: document.getElementById('count').value,
            accuracy: document.getElementById('accuracy').value
        };

        const response = await fetch('/start-raid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        statusDiv.style.color = '#4cd137';
        statusDiv.innerText = result.message;
    });
</script>

</body>
</html>
