<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="3o9jPeJyx8ja1Kp3eESSfHBldvgWU5-9tVXdM98l-98" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketRaid - Kahoot Spammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background: radial-gradient(circle at center, #0f1c12 0%, #050806 100%);
            color: #f1f6f2;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* LOGO OBEN LINKS IN DER ECKE */
        .header-logo {
            position: absolute;
            top: 25px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2ed573 0%, #1dd1a1 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.4);
        }

        /* Minimalistisches Blitz-Symbol im Logo */
        .logo-icon svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .logo-text {
            font-family: 'Merriweather', serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* 1. HERO BEREICH */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Super moderne, fette serifenlose Überschrift */
        .hero-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(3.5rem, 9vw, 6.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -3px;
            margin: 0 0 15px 0;
            text-shadow: 0 0 50px rgba(46, 213, 115, 0.1);
        }

        /* "Socket" im giftgrünen Verlauf */
        .hero-title .title-socket {
            background: linear-gradient(135deg, #2ed573 0%, #1dd1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* "Raid" in cleanem Weiß */
        .hero-title .title-raid {
            color: #ffffff;
        }

        /* Untertitel in klassischer Buch-Schriftart */
        .hero-subtitle {
            font-family: 'Merriweather', serif;
            font-style: italic;
            font-size: clamp(1.1rem, 2.5vw, 1.8rem);
            color: rgba(255, 255, 255, 0.7);
            margin: 0 0 40px 0;
            font-weight: 300;
        }

        /* Pfeil und "zum Panel" in Buch-Schriftart mit niedriger Transparenz */
        .scroll-down {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(46, 213, 115, 0.4);
            transition: all 0.3s ease;
        }

        .scroll-down:hover {
            color: rgba(46, 213, 115, 0.9);
            transform: translateY(3px);
        }

        .scroll-text {
            font-family: 'Merriweather', serif;
            font-style: italic;
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .scroll-arrow {
            font-size: 16px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }


        /* 2. PANEL BEREICH */
        .panel-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        
        .container {
            background: rgba(15, 23, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(46, 213, 115, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(46, 213, 115, 0.05);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .panel-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .live-counter {
            text-align: center;
            font-size: 13px;
            color: #88938a;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .live-counter span {
            color: #2ed573;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(46, 213, 115, 0.4);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 800;
            color: #88938a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background-color: rgba(5, 8, 6, 0.6);
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2ed573;
            background-color: rgba(5, 8, 6, 0.8);
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.2);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2388938a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
        }

        /* Container für Custom-Avatar Dropdown */
        #customAvatarContainer {
            margin-bottom: 20px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Leuchtender grüner Button */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2ed573 0%, #10ac84 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.25);
            transition: all 0.2s ease-in-out;
            font-family: inherit;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
            background: linear-gradient(135deg, #3ae374 0%, #1dd1a1 100%);
        }

        button:active {
            transform: translateY(1px);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            color: #2ed573;
            text-shadow: 0 0 5px rgba(46, 213, 115, 0.2);
        }

        /* FAKE MACOS TERMINAL */
        .terminal-window {
            margin-top: 25px;
            background: #020403;
            border: 1px solid rgba(46, 213, 115, 0.2);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 180px;
            transition: all 0.3s ease;
        }

        .terminal-header {
            background: #111512;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .terminal-buttons {
            display: flex;
            gap: 7px;
        }

        .terminal-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .btn-red { background: #ff5f56; }
        .btn-yellow { background: #ffbd2e; }
        .btn-green { background: #27c93f; }

        .terminal-title {
            font-size: 11px;
            color: #616e64;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            margin-right: 25px;
        }

        .terminal-body {
            padding: 12px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #a4b3a7;
            overflow-y: auto;
            flex-grow: 1;
            line-height: 1.5;
            text-align: left;
            scroll-behavior: smooth;
        }

        .terminal-body::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(46, 213, 115, 0.2);
            border-radius: 2px;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-time {
            color: #616e64;
        }

        .log-info {
            color: #2ed573;
        }

        .log-warn {
            color: #ffbd2e;
        }
    </style>
</head>
<body>

<div class="header-logo">
    <div class="logo-icon">
        <svg viewBox="0 0 24 24">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
    </div>
    <span class="logo-text">SocketRaid</span>
</div>

<div class="hero-section">
    <h1 class="hero-title">
        <span class="title-socket">Socket</span><span class="title-raid">Raid</span>
    </h1>
    <p class="hero-subtitle">The #1 Kahoot Spammer</p>
    
    <a href="#panel" class="scroll-down">
        <span class="scroll-text">zum Panel</span>
        <span class="scroll-arrow">▼</span>
    </a>
</div>

<div class="panel-section" id="panel">
    <div class="container">
        <h2 class="panel-title">Raid Controller</h2>
        <div class="live-counter">Connected Bots: <span id="botCounter">0</span></div>
        
        <form id="raidForm">
            <label for="pin">Kahoot Game PIN</label>
            <input type="text" id="pin" name="pin" required placeholder="e.g. 1013450">

            <label for="baseName">Bot Base Name</label>
            <input type="text" id="baseName" name="baseName" required placeholder="e.g. hack">

            <label for="count">Bot Count</label>
            <input type="number" id="count" name="count" required min="1" max="999" placeholder="e.g. 30">

            <button type="submit">Deploy Bots</button>
        </form>
        <div id="status"></div>

        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <div class="terminal-btn btn-red"></div>
                    <div class="terminal-btn btn-yellow"></div>
                    <div class="terminal-btn btn-green"></div>
                </div>
                <div class="terminal-title">bash — render-server-01 — 80×24</div>
            </div>
            <div class="terminal-body" id="terminalLogs">
                <div class="log-entry"><span class="log-time">[00:00:00]</span> <span class="log-time">[system]</span> Warte auf Startbefehl...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminalLogs');

    // Neue Log-Zeilen im Terminal generieren (Ohne Duplikate!)
    function appendLog(rawText) {
        const time = new Date().toTimeString().split(' ')[0];
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';
        
        let prefix = `<span class="log-info">[info]</span>`;
        let text = rawText;

        if (rawText.startsWith('[system]')) {
            prefix = `<span class="log-time">[system]</span>`;
            text = rawText.replace('[system] ', '');
        } else if (rawText.startsWith('[error]')) {
            prefix = `<span class="log-warn">[error]</span>`;
            text = rawText.replace('[error] ', '');
        } else if (rawText.startsWith('[info]')) {
            prefix = `<span class="log-info">[info]</span>`;
            text = rawText.replace('[info] ', '');
        }

        logEntry.innerHTML = `<span class="log-time">[${time}]</span> ${prefix} ${text}`;
        terminal.appendChild(logEntry);
        terminal.scrollTop = terminal.scrollHeight; // Autoscroll ganz nach unten
    }

    // Live-Verbindung zum Log-Stream deines Servers
    const eventSource = new EventSource('/api/log-stream');
    eventSource.onmessage = function(event) {
        appendLog(event.data);
    };

    eventSource.onerror = function() {
        console.log("Verbindung zum Log-Stream verloren. Versuche erneut...");
    };

    // Live Online-Bot-Zähler updaten (einmal alle 2 Sek.)
    async function updateLiveCounter() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('botCounter').innerText = data.activeCount;
        } catch (e) {}
    }
    setInterval(updateLiveCounter, 2000);

    // Formular absenden (Nur eine, saubere Funktion)
    document.getElementById('raidForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#88938a';
        statusDiv.innerText = 'Sende API-Anfrage an Render...';

        const pin = document.getElementById('pin').value;
        const baseName = document.getElementById('baseName').value;
        const count = document.getElementById('count').value;

        terminal.innerHTML = ''; 
        appendLog('[system] Signal an Render-Server gesendet...');

        const data = { pin, baseName, count };

        try {
            const response = await fetch('/start-raid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            statusDiv.style.color = '#2ed573';
            statusDiv.innerText = result.message;
        } catch (err) {
            statusDiv.style.color = '#ff5f56';
            statusDiv.innerText = 'Verbindung fehlgeschlagen.';
            appendLog('[error] Host nicht erreichbar. Bitte Server-Konsole prüfen.');
        }
    });
</script>
</body>
</html>
